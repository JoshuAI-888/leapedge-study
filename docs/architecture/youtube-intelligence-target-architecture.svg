<text x="48" y="119.80000000000001" font-family="Arial, sans-serif" font-size="51" font-weight="700" fill="#142D48">A simpler acquisition path. An uncompromised evidence trail.</text>
<text x="48" y="168.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#51657A">PROPOSED TARGET  /  15 SEP 2026  /  Standalone now → Finradar · Intelligence → YouTube Intelligence</text>

name: Verify YouTube Intelligence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          YTI_DB: pglite
      - run: npm run typecheck
      - run: npm run build
      # Build plan section 3: the offline gate runs in CI. It needs no keys and
      # exits 0 today, so it costs nothing until a prompt, schema or transport
      # change breaks the harness that measures them — which is the point.
      - run: node --experimental-strip-types scripts/promotion-gate.ts --offline
      - run: npm audit --omit=dev --audit-level=high

  native-google-evaluation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: evaluations/native-google
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: evaluations/native-google/package-lock.json
      # Shadow tests reuse application source/claim validation; install its pinned dependencies too.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
